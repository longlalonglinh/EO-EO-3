# NOTE FOR DUAL DEPLOYMENT ARCHITECTURE:
# GitHub Pages only hosts static frontend assets (HTML, CSS, JS from ./dist).
# The Express backend API (server.ts) containing Gemini multimodal processing must be deployed 
# to a Node.js/Bun hosting platform (e.g. Render, Railway, Fly.io, or VPS).
# Configure `secrets.VITE_API_BASE_URL` in your repository to point frontend API calls to that server URL.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
